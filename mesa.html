<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prumo — Mesa da Agência</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Outfit:wght@400;500;600&display=swap');

    :root {
      --paper: #f3eee4;
      --paper-2: #e7e0d2;
      --ink: #1a1612;
      --muted: #6e665c;
      --line: #d9d0c2;
      --brass: #a56b2a;
      --brass-soft: #f3e6d0;
      --oxblood: #9c3b2e;
      --oxblood-soft: #f6e4df;
      --font-sans: "Outfit", ui-sans-serif, system-ui, -apple-system, sans-serif;
      --font-display: "Fraunces", ui-serif, Georgia, serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    body {
      background: var(--paper);
      color: var(--ink);
      font-family: var(--font-sans);
      line-height: 1.5;
      min-height: 100vh;
    }
    button, input, select, textarea { font: inherit; color: inherit; }
    button:not(:disabled) { cursor: pointer; }
    .tabular-nums { font-variant-numeric: tabular-nums; }

    /* Layout */
    .container { max-width: 72rem; margin: 0 auto; padding: 0 1.25rem; }
    .main-area { max-width: 72rem; margin: 0 auto; padding: 2rem 1.25rem 4rem; }

    /* Header & Nav */
    .topbar {
      position: sticky; top: 0; z-index: 20;
      background: var(--paper);
      border-bottom: 1px solid var(--line);
    }
    .topbar-inner {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
      gap: 0.75rem; padding-top: 0.75rem; padding-bottom: 0.75rem;
    }
    .brand {
      display: flex; align-items: center; gap: 0.75rem;
      background: none; border: none; text-align: left;
    }
    .brand-mark {
      width: 2.75rem; height: 2.75rem; border-radius: 0.5rem;
      border: 1px solid var(--line); background: var(--paper-2);
      display: flex; align-items: center; justify-content: center;
    }
    .brand-line { width: 2px; height: 1.5rem; background: var(--brass); }
    .brand-title { display: block; font-family: var(--font-display); font-size: 1.35rem; line-height: 1.05; }
    .brand-sub { font-size: 0.85rem; color: var(--muted); }
    .topbar-right { display: flex; align-items: center; gap: 0.75rem; }
    .tagline { font-size: 0.875rem; color: var(--muted); }
    @media (max-width: 768px) { .tagline { display: none; } }

    .user-pill {
      display: flex; align-items: center; gap: 0.5rem;
      border: 1px solid var(--line); background: var(--paper-2);
      border-radius: 0.5rem; padding: 0.35rem 0.65rem; font-size: 0.875rem;
    }
    .user-avatar {
      width: 1.6rem; height: 1.6rem; border-radius: 999px;
      background: var(--ink); color: var(--paper);
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 0.75rem; font-weight: 600;
    }
    .btn-logout {
      background: none; border: none; color: var(--muted);
      font-size: 0.8rem; text-decoration: underline; margin-left: 0.25rem;
    }
    .btn-logout:hover { color: var(--oxblood); }

    .nav-bar {
      display: flex; gap: 0.25rem; overflow-x: auto; padding-bottom: 0.75rem;
    }
    .nav-btn {
      display: inline-flex; align-items: center; gap: 0.45rem;
      min-height: 2.5rem; padding: 0 0.85rem; border-radius: 0.5rem;
      border: 1px solid transparent; background: transparent;
      color: var(--muted); font-size: 0.9rem; font-weight: 500; white-space: nowrap;
      transition: all 0.15s;
    }
    .nav-btn:hover { color: var(--ink); background: var(--paper-2); }
    .nav-btn.active {
      background: var(--ink); color: var(--paper); border-color: var(--ink);
    }

    /* Typography & Page Header */
    .page-header { margin-bottom: 2rem; max-width: 48rem; }
    .kicker { font-size: 0.875rem; color: var(--brass); font-weight: 500; }
    .page-title {
      margin-top: 0.25rem; font-family: var(--font-display);
      font-size: clamp(2rem, 4vw, 3rem); line-height: 1.12; font-weight: 400;
    }
    .page-title.italic { font-style: italic; }
    .page-lede { margin-top: 0.75rem; max-width: 42rem; color: var(--muted); font-size: 0.975rem; }

    /* Cards & Panels */
    .panel {
      border-radius: 0.75rem; border: 1px solid var(--line);
      background: var(--paper); padding: 1.25rem 1.5rem;
    }
    .section-head {
      margin-bottom: 1rem; display: flex; flex-wrap: wrap;
      align-items: flex-end; justify-content: space-between; gap: 0.75rem;
    }
    .section-title { font-family: var(--font-display); font-size: 1.5rem; font-weight: 400; }

    /* Stamps & Chips */
    .stamp {
      display: inline-flex; min-height: 1.85rem; align-items: center;
      border-radius: 999px; border: 1px solid var(--line);
      padding: 0 0.75rem; font-size: 0.8rem; font-weight: 500;
    }
    .stamp-brass { border-color: var(--brass); background: var(--brass-soft); color: var(--ink); }
    .stamp-ink { border-color: var(--ink); background: var(--ink); color: var(--paper); }
    .stamp-oxblood { border-color: var(--oxblood); background: var(--oxblood-soft); color: var(--oxblood); }
    .stamp-line { border-color: var(--line); background: var(--paper); color: var(--muted); }

    .chip {
      min-height: 2.4rem; border-radius: 999px; border: 1px solid var(--line);
      background: var(--paper); color: var(--muted);
      padding: 0 0.85rem; font-size: 0.85rem; transition: all 0.15s;
    }
    .chip:hover { color: var(--ink); border-color: var(--ink); }
    .chip.on { border-color: var(--brass); background: var(--brass-soft); color: var(--ink); }

    /* Buttons */
    .btn {
      display: inline-flex; min-height: 2.6rem; align-items: center; justify-content: center;
      gap: 0.5rem; border-radius: 0.5rem; padding: 0 1rem;
      font-size: 0.875rem; font-weight: 500; border: 1px solid transparent;
      transition: all 0.15s; text-decoration: none;
    }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-ink { background: var(--ink); color: var(--paper); }
    .btn-ink:hover:not(:disabled) { background: var(--brass); }
    .btn-brass { background: var(--brass); color: var(--paper); }
    .btn-brass:hover:not(:disabled) { background: var(--ink); }
    .btn-line { border-color: var(--line); background: var(--paper); color: var(--ink); }
    .btn-line:hover:not(:disabled) { border-color: var(--ink); }
    .btn-ghost { background: transparent; color: var(--ink); }
    .btn-ghost:hover:not(:disabled) { background: var(--paper-2); }
    .btn-danger { background: var(--oxblood); color: var(--paper); }
    .btn-danger:hover:not(:disabled) { background: var(--ink); }

    /* Forms */
    .field { display: flex; flex-direction: column; gap: 0.35rem; font-size: 0.875rem; }
    .field-label { color: var(--muted); }
    .control {
      min-height: 2.65rem; width: 100%; border-radius: 0.5rem;
      border: 1px solid var(--line); background: var(--paper);
      padding: 0.5rem 0.75rem; color: var(--ink); outline: none;
      transition: border-color 0.15s;
    }
    .control:focus { border-color: var(--brass); }
    textarea.control { min-height: auto; resize: vertical; }

    /* Grids */
    .grid { display: grid; gap: 1rem; }
    .grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .grid-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .grid-5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }
    .grid-6 { grid-template-columns: repeat(6, minmax(0, 1fr)); }
    .col-span-2 { grid-column: span 2; }
    .col-span-3 { grid-column: span 3; }

    @media (max-width: 960px) {
      .grid-5, .grid-6, .grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .col-span-2, .col-span-3 { grid-column: span 2; }
    }
    @media (max-width: 640px) {
      .grid-2, .grid-3, .grid-4, .grid-5, .grid-6 { grid-template-columns: 1fr; }
      .col-span-2, .col-span-3 { grid-column: span 1; }
    }

    /* Step cards */
    .step-card {
      display: flex; min-height: 6rem; flex-direction: column; justify-content: space-between;
      border-radius: 0.75rem; border: 1px solid var(--line); background: var(--paper);
      padding: 0.85rem; text-align: left; transition: border-color 0.15s;
    }
    .step-card:hover { border-color: var(--ink); }
    .step-num { font-size: 0.85rem; color: var(--brass); font-weight: 500; }
    .step-title { display: block; font-weight: 500; }
    .step-hint { font-size: 0.82rem; color: var(--muted); }

    /* Lists */
    .divide-list { list-style: none; }
    .divide-list > li { border-bottom: 1px solid var(--line); padding: 0.85rem 0; }
    .divide-list > li:last-child { border-bottom: none; }

    /* Campaign switcher */
    .camp-bar { display: flex; gap: 0.5rem; overflow-x: auto; padding-bottom: 0.5rem; margin-bottom: 1rem; }

    /* Stat Box */
    .stat-box { background: var(--paper-2); border-radius: 0.5rem; padding: 0.85rem 1rem; }
    .stat-k { font-size: 0.82rem; color: var(--muted); }
    .stat-v { margin-top: 0.25rem; font-family: var(--font-display); font-size: 1.65rem; }

    /* Creative Preview Frames */
    .frame-feed { aspect-ratio: 1 / 1; width: 19rem; max-width: 100%; }
    .frame-stories { aspect-ratio: 9 / 16; width: 15.5rem; max-width: 100%; }
    .frame-display { aspect-ratio: 16 / 9; width: 100%; max-width: 36rem; }
    .creative-box {
      display: flex; flex-direction: column; justify-content: space-between;
      border-radius: 0.75rem; border: 1px solid var(--line); padding: 1.35rem;
    }
    .creative-ink { background: var(--ink); color: var(--paper); }
    .creative-paper { background: var(--paper-2); color: var(--ink); }

    /* Auth Screen */
    .auth-wrap {
      min-height: 100vh; display: grid; align-items: center;
      max-width: 68rem; margin: 0 auto; padding: 2rem 1.25rem;
      grid-template-columns: 1.1fr 0.9fr; gap: 3rem;
    }
    @media (max-width: 860px) {
      .auth-wrap { grid-template-columns: 1fr; }
      .auth-side { display: none; }
    }
    .auth-card {
      border: 1px solid var(--line); background: var(--paper);
      border-radius: 0.85rem; padding: 2rem;
    }
    .auth-tabs {
      display: flex; gap: 0.5rem; margin-bottom: 1.5rem;
      border-bottom: 1px solid var(--line); padding-bottom: 0.75rem;
    }

    /* Progress bar */
    .bar-bg { height: 0.55rem; border-radius: 999px; background: var(--paper-2); overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 999px; background: var(--brass); transition: width 0.3s; }

    /* Flex helpers */
    .flex-row { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; }
    .flex-between { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0.75rem; }
    .mt-1 { margin-top: 0.25rem; }
    .mt-2 { margin-top: 0.5rem; }
    .mt-3 { margin-top: 0.75rem; }
    .mt-4 { margin-top: 1rem; }
    .mt-6 { margin-top: 1.5rem; }
    .mt-8 { margin-top: 2rem; }
    .mb-2 { margin-bottom: 0.5rem; }
    .mb-4 { margin-bottom: 1rem; }
    .mb-6 { margin-bottom: 1.5rem; }
    .text-sm { font-size: 0.875rem; }
    .text-muted { color: var(--muted); }
    .text-brass { color: var(--brass); }
    .text-oxblood { color: var(--oxblood); }
    .font-medium { font-weight: 500; }
    .font-display { font-family: var(--font-display); }
    .link-btn {
      background: none; border: none; padding: 0; font: inherit;
      font-weight: 500; color: var(--ink); text-align: left;
    }
    .link-btn:hover { color: var(--brass); }

    /* Ferramentas de mídia e relatórios */
    .creative-stage {
      display: flex; flex-direction: column; align-items: center; gap: 0.85rem;
      border: 1px solid var(--line); border-radius: 0.75rem; padding: 1rem;
      background: var(--paper-2);
    }
    .creative-canvas {
      display: block; width: 100%; max-width: 32rem; height: auto;
      border-radius: 0.45rem; background: var(--ink); box-shadow: 0 8px 24px rgba(26,22,18,.12);
    }
    .media-actions { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
    .notice { border: 1px solid var(--line); border-radius: .5rem; padding: .75rem; background: var(--paper-2); }
    .file-control { display: block; width: 100%; padding: .55rem; border: 1px dashed var(--line); border-radius: .5rem; background: var(--paper-2); font-size: .85rem; }
    .metric-note { font-size: .78rem; color: var(--muted); margin-top: .35rem; }
    .task-row { display:flex; align-items:flex-start; justify-content:space-between; gap:.8rem; padding:.8rem 0; border-bottom:1px solid var(--line); }
    .task-row:last-child { border-bottom:0; }
    .overflow-x-auto { overflow-x:auto; }
    .calendar-grid { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:5px; }
    .calendar-day { min-height:82px; border:1px solid var(--line); border-radius:.45rem; padding:.4rem; background:var(--paper); overflow:hidden; }
    .calendar-day.outside { opacity:.42; background:var(--paper-2); }
    .calendar-post { display:block; margin-top:.25rem; padding:.2rem .3rem; border-radius:.25rem; background:var(--brass-soft); color:var(--ink); font-size:.68rem; line-height:1.25; overflow-wrap:anywhere; }
    .variant-box { border:1px solid var(--line); border-radius:.65rem; padding:1rem; background:var(--paper); }
    .segment-bar { display:flex; height:.7rem; overflow:hidden; border-radius:999px; background:var(--paper-2); }
    .segment-bar > span { background:var(--brass); }
    @media(max-width:640px){.calendar-day{min-height:58px;padding:.25rem}.calendar-post{font-size:.6rem}.calendar-day .day-name{font-size:.7rem}}
    .report-toolbar { display:flex; flex-wrap:wrap; gap:.5rem; align-items:center; }
    .integration-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem}
    .integration-card{border:1px solid var(--line);border-radius:.65rem;padding:1rem;background:var(--paper-2)}
    .integration-status{font-size:.78rem;color:var(--muted)}
    .soft-warning{border:1px solid var(--brass);background:var(--brass-soft);border-radius:.55rem;padding:.8rem;font-size:.82rem}
    .ad-row{display:grid;grid-template-columns:1.2fr .8fr .8fr .7fr auto;gap:.75rem;align-items:center;padding:.8rem 0;border-bottom:1px solid var(--line)}
    @media(max-width:760px){.integration-grid{grid-template-columns:1fr}.ad-row{grid-template-columns:1fr 1fr}}

    .auth-note { color: var(--muted); font-size: .78rem; line-height:1.45; }
    .insight-tag { display:inline-flex; padding:.25rem .6rem; border:1px solid var(--line); border-radius:999px; font-size:.75rem; color:var(--muted); margin:.15rem; }
  </style>

  <style id="prumo-assistant-styles">
    .prumo-ai-toggle{position:fixed;right:22px;bottom:22px;z-index:100020;border:1px solid #cdbb9f;background:#2d241d;color:#fffaf2;border-radius:999px;padding:13px 18px;display:flex;align-items:center;gap:10px;box-shadow:0 12px 34px #2b211d33;font-weight:600;letter-spacing:.01em;transition:transform .2s,background .2s}

    .prumo-ai-typing{align-self:flex-start;display:flex;gap:6px;padding:13px 15px;background:#eee5d8;border-radius:14px 14px 14px 4px}

    .prumo-ai-bean:nth-child(2){animation-delay:.15s}.prumo-ai-bean:nth-child(3){animation-delay:.3s}
    @keyframes prumo-bean{0%,70%,100%{transform:translateY(0) rotate(28deg);opacity:.45}35%{transform:translateY(-5px) rotate(-18deg);opacity:1}}
    .prumo-ai-suggestions{display:flex;flex-wrap:wrap;gap:7px;padding:0 18px 12px}

    .prumo-ai-footnote{font-size:10px;color:#887a68;line-height:1.45;margin-top:8px}
    .prumo-ai-panel button:focus-visible,.prumo-ai-toggle:focus-visible{outline:3px solid #bd8a4b;outline-offset:3px}
    @media(max-width:600px){.prumo-ai-toggle{right:14px;bottom:14px;padding:12px 15px}.prumo-ai-head{padding-top:18px}}
    @media(prefers-reduced-motion:reduce){.prumo-ai-panel,.prumo-ai-toggle{transition:none}.prumo-ai-bean{animation:none}}
    body.prumo-chat-open{overflow:hidden}
  </style>

  <div id="app"></div>

  <script>
    // =========================================================================
    // CONSTANTES & LEIS DA CASA (src/lib/laws.ts & src/lib/format.ts)
    // =========================================================================
    const LAWS = [
      { id: "lgpd", kind: "lei", title: "LGPD", text: "A campanha pede só o dado que a oferta precisa, com finalidade dita." },
      { id: "cdc", kind: "lei", title: "CDC", text: "Preço, condição e o que está incluso cabem na peça ou na página." },
      { id: "conar", kind: "lei", title: "CONAR", text: "A promessa se demonstra. Sem medo, sem exploração, sem superioridade vazia." },
      { id: "plataforma", kind: "lei", title: "Meio", text: "A peça cabe na política do canal — Meta, Google, TikTok, LinkedIn ou YouTube." },

    const CPM = { meta: 32, google: 22, tiktok: 14, linkedin: 55, youtube: 26 };
    const BASE_CTR = { leads: 0.011, vendas: 0.008, trafego: 0.016, alcance: 0.005, engajamento: 0.02 };
    const BASE_CVR = { leads: 0.12, vendas: 0.07, trafego: 0.02, alcance: 0.01, engajamento: 0.03 };

    function aggregate(events) {
      const sum = (t) => events.filter((e) => e.type === t).reduce((a, e) => a + Number(e.volume || 0), 0);
      const spend = events.reduce((a, e) => a + Number(e.spend || 0), 0);
      const impressions = sum("impressao");
      const views = sum("view");
      const clicks = sum("clique");
      const leads = sum("lead");
      const purchases = sum("compra");
      const reach = impressions + views;
      const conversions = leads + purchases;
      return {
        spend, impressions, views, clicks, leads, purchases, reach, conversions,
        ctr: reach ? clicks / reach : 0,
        conversionRate: clicks ? conversions / clicks : 0,
        cpa: conversions ? spend / conversions : 0,
        cpc: clicks ? spend / clicks : 0,
      };
    }

    function projectBatch(campaign, at) {
      const assumptions = campaign.aiInputs || { tightness: 3, offerStrength: 3, fatigue: 3 };
      const tight = 0.75 + Number(assumptions.tightness || 3) * 0.12;
      const offer = 0.7 + Number(assumptions.offerStrength || 3) * 0.15;
      const fatigue = Math.max(0.35, 1.15 - Number(assumptions.fatigue || 3) * 0.12);
      const impressions = Math.max(1000, Math.round((campaign.budget / CPM[campaign.channel]) * 1000));
      const clicks = Math.max(1, Math.round(impressions * BASE_CTR[campaign.objective] * tight * fatigue));
      const conversions = Math.max(0, Math.round(clicks * BASE_CVR[campaign.objective] * offer));
      const sale = campaign.objective === "vendas";
      const note = "Projeção simulada da mesa — não é dado da plataforma";
      return [
        { id: uid("evt"), campaignId: campaign.id, type: "impressao", volume: impressions, spend: campaign.budget, at, note },
        { id: uid("evt"), campaignId: campaign.id, type: "clique", volume: clicks, spend: 0, at, note },
        { id: uid("evt"), campaignId: campaign.id, type: sale ? "compra" : "lead", volume: conversions, spend: 0, at, note },
      ];
    }

    // Projeção transparente: usa os últimos sete dias corridos registrados.
    // Não é machine learning nem substitui dados das plataformas de anúncios.
    function forecast(events, campaign) {
      const today = new Date();
      today.setHours(12, 0, 0, 0);
      const from = new Date(today);
      from.setDate(from.getDate() - 6);
      const iso = (d) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      const fromIso = iso(from);
      const toIso = iso(today);
      const recent = events.filter((e) => e.at >= fromIso && e.at <= toIso);
      const recentStats = aggregate(recent);
      const assumptions = campaign.aiInputs || { tightness: 3, offerStrength: 3, fatigue: 3 };
      const factor = Math.max(0.65, Math.min(1.35,
        1 + ((Number(assumptions.tightness || 3) - 3) * 0.035)
          + ((Number(assumptions.offerStrength || 3) - 3) * 0.045)
          - ((Number(assumptions.fatigue || 3) - 3) * 0.055)));
      const rawDaily = recentStats.conversions / 7;
      const total = Math.max(0, Math.round(rawDaily * 14 * factor));
      const base = Math.floor(total / 14);
      let remainder = total % 14;
      const series = Array.from({ length: 14 }, (_, i) => {
        const d = new Date(today); d.setDate(d.getDate() + i + 1);
        const conversions = base + (remainder-- > 0 ? 1 : 0);
        return { dia: `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}`, conversoes: conversions };
      });
      const activeDays = new Set(recent.map((e) => e.at)).size;
      return { total, series, recentStats, activeDays, factor, from: fromIso, to: toIso, hasRecentData: recent.length > 0 };
    }

    function predictionCopy(campaign, events, product, projection, stats) {
      if (!projection.hasRecentData) {
        return "Não há eventos registrados nos últimos sete dias. Registre os resultados reais ou importe um CSV na Gestão para gerar uma estimativa. A projeção não inventará desempenho sem dados.";
      }
      const unit = campaign.objective === "vendas" ? "compras" : campaign.objective === "leads" ? "leads" : "conversões";
      const days = projection.activeDays;
      const cpaText = stats.conversions ? ` O custo médio por conversão registrado é ${brl(stats.cpa)}.` : " Ainda não há conversões suficientes para calcular o custo por conversão.";
      const roas = stats.spend && product ? (stats.purchases * product.price) / stats.spend : 0;
      const roasText = campaign.objective === "vendas" && stats.spend ? ` O ROAS observado é ${roas.toFixed(2).replace('.', ',')}.` : "";
      return `Com base nos últimos sete dias (${projection.from} a ${projection.to}), a estimativa linear aponta cerca de ${projection.total} ${unit} nos próximos 14 dias. Foram encontrados registros em ${days} dia(s); os ajustes de público, oferta e fadiga alteram o cenário em ${(projection.factor * 100).toFixed(0)}% da linha de base. Esta é uma estimativa simples, não uma previsão de IA nem uma garantia de resultado.` + cpaText + roasText;
    }

    function saveUser(u) {

    function selectCampaign(id) {
      state.selectedCampaignId = id;
      const camp = state.data.campaigns.find((c) => c.id === id) || state.data.campaigns[0];
      if (camp) {
        const prod = state.data.products.find((p) => p.id === camp.productId);
        state.copyObjective = camp.objective || "leads";
        state.copyOffer = prod?.offer ?? "";
        const nextDraft = { headline: "", hook: "", corpo: "", cta: "", variacao: "" };
        TIERS.forEach((t) => {
          const p = state.data.pieces.find((item) => item.campaignId === camp.id && item.tier === t);
          if (p) nextDraft[t] = p.text;
        });
        state.copyDraft = nextDraft;
        state.copyMsg = "";

        const firstCrt = state.data.creatives.find((c) => c.campaignId === camp.id);
        state.editorCurrent = firstCrt
          ? { ...firstCrt }
          : { id: uid("crt"), campaignId: camp.id, name: "Novo criativo", mediaType: "imagem", videoDuration: 10, format: "feed", headline: "", sub: "", offer: "", cta: "Saiba mais", treatment: "ink" };
        state.editorMediaType = state.editorCurrent.mediaType || "imagem";
        state.editorVideoDuration = Number(state.editorCurrent.videoDuration || 10);
        state.editorSaved = false;
        state.auditorHint = "";
      }
    }

    function pageCrm() {
      const camp = state.data.campaigns.find((c) => c.id === state.selectedCampaignId) || state.data.campaigns[0];
      if (!camp) return `<section class="panel">Cadastre uma campanha para iniciar o CRM.</section>`;
      const prod = state.data.products.find((p) => p.id === camp.productId);
      const rows = state.data.events.filter((e) => e.campaignId === camp.id);
      const stats = aggregate(rows);
      const revenue = stats.purchases * Number(prod?.price || 0);
      const roas = stats.spend ? revenue / stats.spend : 0;
      const projection = forecast(rows, camp);
      const behavior = [
        { id: "fria", label: "Intenção fria", detail: "Impressões e visualizações", value: stats.reach },
        { id: "media", label: "Intenção média", detail: "Cliques", value: stats.clicks },
        { id: "quente", label: "Intenção quente", detail: "Leads e compras", value: stats.conversions },
      ];
      const maxBeh = Math.max(1, ...behavior.map((b) => b.value));
      const series = projection.series;
      const maxSer = Math.max(1, ...series.map((x) => x.conversoes));
      const savedAudience = (state.data.audienceInsights || []).filter((item) => item.campaignId === camp.id).sort((a,b) => String(b.updatedAt).localeCompare(String(a.updatedAt)))[0];
      const audienceDraft = savedAudience ? { ...state.crmAudienceDraft, ...savedAudience } : state.crmAudienceDraft;
      const bodyHtml = state.crmTab === "dados" ? `

          <p class="metric-note">CSV: tipo, volume, verba, data e nota. Importar acrescenta os registros à campanha selecionada; não substitui os existentes.</p>
          <ul class="divide-list mt-6">
            ${rows.length === 0 ? `<li class="text-sm text-muted">Nenhum evento ainda.</li>` : rows.map((ev) => `
              <li class="flex-between text-sm">
                <span>${EVENT_LABEL[ev.type]} · <strong class="tabular-nums">${num(ev.volume)}</strong>${ev.spend ? ` · ${brl(ev.spend)}` : ""}</span>
                <span class="text-muted">${dayLabel(ev.at)} · ${esc(ev.note)}</span>
                <button type="button" class="btn btn-ghost" onclick="removeEvent('${ev.id}')">Tirar</button>
              </li>

        <section class="panel mt-4">
          <div class="section-head"><h2 class="section-title">Planejamento de conteúdo orgânico</h2><span class="stamp stamp-brass">Calendário editorial</span></div>
          <p class="text-sm text-muted mb-4">Organize publicações sem verba de mídia. Este calendário é independente dos eventos de anúncios pagos e não publica diretamente nas redes.</p>
          <div class="grid grid-3">
            <label class="field"><span class="field-label">Título / pauta</span><input class="control" id="org-title" value="${esc(state.organicDraft.title)}" placeholder="Ex.: Bastidores da produção" /></label>
            <label class="field"><span class="field-label">Data de publicação</span><input class="control" id="org-date" type="date" value="${esc(state.organicDraft.date)}" /></label>
            <label class="field"><span class="field-label">Rede social</span><select class="control" id="org-platform">${Object.entries(CHANNEL_LABEL).map(([id,label]) => `<option value="${id}" ${state.organicDraft.platform === id ? "selected" : ""}>${label}</option>`).join("")}</select></label>
            <label class="field"><span class="field-label">Formato</span><select class="control" id="org-format">${[["feed","Feed"],["stories","Stories"],["reels","Reels / Shorts"],["carrossel","Carrossel"],["video","Vídeo"],["artigo","Artigo / texto"]].map(([id,label]) => `<option value="${id}" ${state.organicDraft.format === id ? "selected" : ""}>${label}</option>`).join("")}</select></label>
            <label class="field"><span class="field-label">Objetivo</span><select class="control" id="org-objective">${Object.entries(OBJECTIVE_LABEL).map(([id,label]) => `<option value="${id}" ${state.organicDraft.objective === id ? "selected" : ""}>${label}</option>`).join("")}</select></label>
            <label class="field"><span class="field-label">Status</span><select class="control" id="org-status">${[["planejado","Planejado"],["produzindo","Em produção"],["agendado","Agendado"],["publicado","Publicado"]].map(([id,label]) => `<option value="${id}" ${state.organicDraft.status === id ? "selected" : ""}>${label}</option>`).join("")}</select></label>
            <label class="field" style="grid-column:1/-1"><span class="field-label">Legenda / briefing do conteúdo</span><textarea class="control" rows="3" id="org-caption" placeholder="Escreva a ideia, legenda ou instruções para produção.">${esc(state.organicDraft.caption)}</textarea></label>
          </div>
          <div class="flex-row mt-3"><button type="button" class="btn btn-ink" onclick="saveOrganicPost('${camp.id}')">${state.organicEditingId ? "Atualizar publicação" : "Adicionar ao calendário"}</button>${state.organicEditingId ? `<button type="button" class="btn btn-ghost" onclick="cancelOrganicEdit()">Cancelar edição</button>` : ""}<button type="button" class="btn btn-line" onclick="exportOrganicCalendar()">Exportar calendário CSV</button></div>
          <div class="section-head mt-6"><h3 class="section-title">Calendário mensal</h3><div class="flex-row"><button type="button" class="btn btn-line" onclick="shiftOrganicMonth(-1)">←</button><strong>${organicMonthLabel(state.organicCalendarMonth)}</strong><button type="button" class="btn btn-line" onclick="shiftOrganicMonth(1)">→</button></div></div>
          ${renderOrganicMonthCalendar(camp.id)}
          <div class="section-head mt-6"><h3 class="section-title">Publicações planejadas</h3><span class="text-sm text-muted">${(state.data.organicPosts || []).filter(p => p.campaignId === camp.id).length} item(ns)</span></div>
          ${(state.data.organicPosts || []).filter(p => p.campaignId === camp.id).sort((a,b) => String(a.date).localeCompare(String(b.date))).length ? `<ul class="divide-list">${(state.data.organicPosts || []).filter(p => p.campaignId === camp.id).sort((a,b) => String(a.date).localeCompare(String(b.date))).map(post => `<li><div class="flex-between"><div><strong>${esc(post.title)}</strong><p class="text-sm text-muted">${dayLabel(post.date)} · ${esc(CHANNEL_LABEL[post.platform] || post.platform)} · ${esc(post.format)} · ${esc(OBJECTIVE_LABEL[post.objective] || post.objective)}</p></div><select class="control" style="width:auto" onchange="updateOrganicPostStatus('${post.id}',this.value)">${[["planejado","Planejado"],["produzindo","Em produção"],["agendado","Agendado"],["publicado","Publicado"]].map(([id,label]) => `<option value="${id}" ${post.status === id ? "selected" : ""}>${label}</option>`).join("")}</select></div><p class="text-sm mt-2">${esc(post.caption || "Sem legenda cadastrada.")}</p><div class="flex-row mt-2"><button type="button" class="btn btn-ghost" onclick="editOrganicPost('${post.id}')">Editar</button><button type="button" class="btn btn-ghost" onclick="deleteOrganicPost('${post.id}')">Excluir</button></div></li>`).join("")}</ul>` : `<p class="text-sm text-muted">Nenhuma publicação planejada para esta campanha.</p>`}

        <section class="panel mt-4">

          <div class="overflow-x-auto"><table style="width:100%;border-collapse:collapse;font-size:.88rem;"><thead><tr style="text-align:left;border-bottom:1px solid var(--line);"><th style="padding:.55rem">Campanha</th><th style="padding:.55rem">Natureza</th><th style="padding:.55rem">Período</th><th style="padding:.55rem">Status</th><th style="padding:.55rem">Eventos</th><th style="padding:.55rem">Ação</th></tr></thead><tbody>${state.data.campaigns.slice().sort((a,b)=>String(b.start||"").localeCompare(String(a.start||""))).map(item=>`<tr style="border-bottom:1px solid var(--line);"><td style="padding:.65rem .55rem"><strong>${esc(item.client)}</strong><br><span class="text-muted">${esc(item.name)}</span></td><td style="padding:.65rem .55rem">${item.mediaType === "organica" ? "Orgânica" : "Paga"}</td><td style="padding:.65rem .55rem">${dayLabel(item.start)} – ${dayLabel(item.end)}</td><td style="padding:.65rem .55rem">${esc(STATUS_LABEL[item.status] || item.status)}</td><td style="padding:.65rem .55rem">${state.data.events.filter(e=>e.campaignId===item.id).length}</td><td style="padding:.65rem .55rem"><button type="button" class="btn btn-line" onclick="go('crm','${item.id}')">Abrir CRM</button></td></tr>`).join("")}</tbody></table></div>
          <button type="button" class="btn btn-ink mt-4" onclick="printExecutiveReport()">Relatório executivo · PDF</button>
        </section>
      `;

    function pageAuditoria() {
      const camp = state.data.campaigns.find((c) => c.id === state.selectedCampaignId) || state.data.campaigns[0];
      const audit = state.data.audits.find((a) => a.campaignId === camp.id);
      const verdictTone = audit?.verdict === "favoravel" ? "stamp-brass" : audit?.verdict === "desfavoravel" ? "stamp-oxblood" : "stamp-line";
      const verdictLabel = audit?.verdict === "favoravel" ? "Favorável" : audit?.verdict === "desfavoravel" ? "Desfavorável" : "Em leitura";

      const renderChecks = (title, kind) => {
        const list = audit.checks.filter((c) => c.kind === kind);
        return `
          <section class="panel">
            <div class="section-head"><h2 class="section-title">${title}</h2></div>
            <div style="display:flex; flex-direction:column; gap:1.25rem;">
              ${list.map((chk) => {
                const rule = ruleById(chk.refId);
                return `
                  <div>
                    <p class="font-medium">${esc(rule?.title ?? chk.refId)}</p>
                    <p class="text-sm text-muted">${esc(rule?.text ?? "")}</p>
                    <div class="flex-row mt-2">
                      ${[["conforme", "Conforme"], ["risco", "Risco"], ["bloqueio", "Bloqueio"]].map(([st, lbl]) => {
                        const tone = chk.status === st ? (st === "bloqueio" ? "btn-danger" : st === "risco" ? "btn-brass" : "btn-ink") : "btn-line";
                        return `<button type="button" class="btn ${tone}" onclick="updateAuditCheck('${audit.id}', '${chk.id}', '${st}')">${lbl}</button>`;
                      }).join("")}
                    </div>
                    ${chk.note ? `<p class="text-sm mt-2">${esc(chk.note)}</p>` : ""}
                  </div>
                `;
              }).join("")}
            </div>
          </section>
        `;
      };

      return `
        <header class="page-header">
          <p class="kicker">Auditoria</p>
          <h1 class="page-title">O parecer antes de subir.</h1>
          <p class="page-lede">Leis, diretrizes da casa, conformidade, alerta e o aceite de quem assina. Favorável sobe. Desfavorável volta para a copy.</p>
        </header>
        ${renderCampaignBar()}

        <div class="flex-row mb-4">
          <button type="button" class="btn btn-ink" onclick="openAudit('${camp.id}')">${audit ? "Leitura aberta" : "Iniciar leitura"}</button>
          <button type="button" class="btn btn-line" onclick="suggestAudit('${camp.id}')">Ler peças e sugerir</button>
          ${audit ? `<span class="stamp ${verdictTone}">${verdictLabel}</span>` : ""}
        </div>
        ${state.auditorHint ? `<p class="text-sm text-muted mb-4">${esc(state.auditorHint)}</p>` : ""}
        ${audit ? `<section class="panel mb-4"><div class="section-head"><h2 class="section-title">Resumo de conformidade</h2><button type="button" class="btn btn-line" onclick="exportAuditReport('${camp.id}')">Exportar relatório da auditoria</button></div><div class="grid grid-3"><div class="stat-box"><p class="stat-k">Conformes</p><p class="stat-v">${audit.checks.filter(c => c.status === "conforme").length}</p></div><div class="stat-box"><p class="stat-k">Em risco</p><p class="stat-v">${audit.checks.filter(c => c.status === "risco").length}</p></div><div class="stat-box"><p class="stat-k">Bloqueios</p><p class="stat-v">${audit.checks.filter(c => c.status === "bloqueio").length}</p></div></div><p class="metric-note mt-3">O resumo é um checklist operacional de apoio. A aprovação final continua sendo manual e deve considerar contexto, legislação aplicável e regras atualizadas de cada plataforma.</p></section>` : ""}

        ${!audit ? `
          <section class="panel">
            <p class="text-muted">A leitura ainda não foi aberta. As leis abaixo são o critério — o parecer começa quando você inicia.</p>
            <div class="mt-4" style="display:flex; flex-direction:column; gap:0.85rem;">
              ${LAWS.map((l) => `<div><p class="font-medium">${l.title}</p><p class="text-sm text-muted">${l.text}</p></div>`).join("")}
            </div>
          </section>
        ` : `
          <div class="grid grid-5">
            <div class="col-span-3" style="display:flex; flex-direction:column; gap:1rem;">
              ${renderChecks("Leis", "lei")}
              ${renderChecks("Diretrizes", "diretriz")}
            </div>
            <div class="col-span-2" style="display:flex; flex-direction:column; gap:1rem;">
              <section class="panel">
                <div class="section-head"><h2 class="section-title">Parecer</h2></div>
                <div class="flex-row">
                  <button type="button" class="btn ${audit.verdict === "favoravel" ? "btn-brass" : "btn-line"}" onclick="setAuditVerdict('${audit.id}', 'favoravel')">Favorável</button>
                  <button type="button" class="btn ${audit.verdict === "desfavoravel" ? "btn-danger" : "btn-line"}" onclick="setAuditVerdict('${audit.id}', 'desfavoravel')">Desfavorável</button>
                </div>
                <p class="text-sm text-muted mt-3">${esc(camp.client)} · ${esc(camp.name)}</p>
              </section>
              <section class="panel">
                <div class="section-head"><h2 class="section-title">Alerta</h2></div>
                <textarea class="control" rows="4" placeholder="O que impede a peça de subir." oninput="setAuditAlert('${audit.id}', this.value)">${esc(audit.alert)}</textarea>
              </section>
              <section class="panel">
                <div class="section-head"><h2 class="section-title">Aceite</h2></div>
                ${audit.accepted ? `
                  <p class="text-sm">${esc(audit.acceptor)} aceitou em ${dayLabel(audit.acceptedAt)}${audit.verdict === "desfavoravel" ? " — com ressalva." : "."}</p>
                ` : `
                  <label class="field"><span class="field-label">Quem assume</span><input class="control" value="${esc(state.auditorName)}" oninput="state.auditorName=this.value" /></label>
                  <button type="button" class="btn btn-ink mt-3" onclick="acceptAudit('${audit.id}')">Registrar aceite</button>
                `}
              </section>
            </div>
          </div>
        `}

        ${audit ? `<section class="panel mt-4"><div class="section-head"><h2 class="section-title">Plano de correção</h2><span class="text-sm text-muted">Ações sugeridas</span></div>${audit.checks.filter(c => c.status === "risco" || c.status === "bloqueio").length ? `<ul class="divide-list">${audit.checks.filter(c => c.status === "risco" || c.status === "bloqueio").map(c => { const r=ruleById(c.refId); return `<li><div class="flex-between"><strong>${esc(r?.title || c.refId)}</strong><span class="stamp ${c.status === "bloqueio" ? "stamp-oxblood" : "stamp-brass"}">${c.status === "bloqueio" ? "Bloqueio" : "Risco"}</span></div><p class="text-sm text-muted mt-1">${esc(c.note || r?.text || "Ponto a revisar manualmente.")}</p><p class="text-sm mt-2"><strong>Próxima ação:</strong> ${esc(auditRemediation(c.refId))}</p></li>`; }).join("")}</ul>` : `<p class="text-sm text-muted">Nenhum risco ou bloqueio marcado no checklist. Mantenha as evidências e autorizações arquivadas.</p>`}</section>` : ""}

    function bytesToHex(bytes) { return Array.from(bytes).map((b) => b.toString(16).padStart(2, "0")).join(""); }
    function hexToBytes(hex) { return new Uint8Array((hex.match(/.{1,2}/g) || []).map((b) => parseInt(b, 16))); }

    async function hashPassword(password, saltHex) {
      if (!crypto?.subtle) throw new Error("Abra o arquivo em um servidor local (localhost) ou HTTPS para habilitar a proteção de senha do navegador.");
      const salt = saltHex ? hexToBytes(saltHex) : crypto.getRandomValues(new Uint8Array(16));
      const key = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveBits"]);
      const bits = await crypto.subtle.deriveBits({ name: "PBKDF2", salt, iterations: 180000, hash: "SHA-256" }, key, 256);
      return { salt: bytesToHex(salt), hash: bytesToHex(new Uint8Array(bits)) };
    }

    async function handleAuthSubmit(e) {
      e.preventDefault();
      const email = document.getElementById("auth-email").value.trim().toLowerCase();
      const pass = document.getElementById("auth-pass").value;
      const nameEl = document.getElementById("auth-name");
      const confirmEl = document.getElementById("auth-confirm");
      const isReg = state.authMode === "register";
      if (!email || !email.includes("@")) { state.authError = "Informe um e-mail válido."; render(); return; }
      const minPasswordLength = prumoApiBase() ? 10 : 8;
      if (pass.length < minPasswordLength) { state.authError = `A senha precisa ter pelo menos ${minPasswordLength} caracteres.`; render(); return; }
      if (isReg && pass !== confirmEl?.value) { state.authError = "As senhas não coincidem."; render(); return; }
      const name = nameEl ? nameEl.value.trim() : "";
      if (isReg && name.length < 2) { state.authError = "Informe seu nome."; render(); return; }
      try {
        const apiBase = prumoApiBase();
        if (apiBase) {
          const endpoint = isReg ? "/api/register" : "/api/login";
          const remote = await prumoApiRequest(endpoint, { method: "POST", body: { name, email, password: pass } });
          saveUser({ name: remote.user.name, email: remote.user.email, apiToken: remote.token, cloudAuth: true });
          state.data = loadState(email);
          state.route = "mesa";
          state.selectedCampaignId = state.data.campaigns[0]?.id || "";
          state.authError = "";
          selectCampaign(state.selectedCampaignId);
          render();
          return;
        }
        const accounts = getAccounts();
        let account = accounts.find((a) => a.email === email);
        if (isReg) {
          if (account) { state.authError = "Já existe uma conta com este e-mail. Entre nela."; render(); return; }
          const credentials = await hashPassword(pass);
          const recoveryCode = Array.from(crypto.getRandomValues(new Uint8Array(8))).map((b) => b.toString(16).padStart(2, "0")).join("").toUpperCase();
          const recovery = await hashPassword(recoveryCode);
          account = { name, email, salt: credentials.salt, passwordHash: credentials.hash, recoverySalt: recovery.salt, recoveryHash: recovery.hash, createdAt: new Date().toISOString() };
          accounts.push(account);
          saveAccounts(accounts);
          window.alert(`Conta criada!

GUARDE SEU CÓDIGO DE RECUPERAÇÃO:
${recoveryCode}

Ele será exibido apenas agora. Guarde-o fora deste computador.`);
        } else {
          if (!account) { state.authError = "Conta não encontrada. Crie uma conta primeiro."; render(); return; }
          const credentials = await hashPassword(pass, account.salt);
          if (credentials.hash !== account.passwordHash) { state.authError = "E-mail ou senha incorretos."; render(); return; }
        }
        saveUser({ name: account.name, email: account.email });
        state.data = loadState(email);
        state.route = "mesa";
        state.selectedCampaignId = state.data.campaigns[0]?.id || "";
        state.authError = "";
        selectCampaign(state.selectedCampaignId);
        render();
      } catch (err) {
        state.authError = err?.message || "Não foi possível concluir a autenticação neste navegador.";
        render();
      }
    }

    async function recoverLocalPassword() {
      const email = (document.getElementById("auth-email")?.value || window.prompt("E-mail da conta:") || "").trim().toLowerCase();
      if (!email) return;
      const accounts = getAccounts();
      const account = accounts.find((a) => a.email === email);
      if (!account || !account.recoveryHash) { window.alert("Conta não encontrada ou sem código de recuperação. Não é possível redefinir a senha neste arquivo."); return; }
      const code = window.prompt("Digite o código de recuperação salvo quando a conta foi criada:");
      if (!code) return;
      const verified = await hashPassword(code.trim().toUpperCase(), account.recoverySalt);
      if (verified.hash !== account.recoveryHash) { window.alert("Código de recuperação incorreto."); return; }
      const next = window.prompt("Digite a nova senha (mínimo de 8 caracteres):");
      if (!next || next.length < 8) { window.alert("A nova senha precisa ter pelo menos 8 caracteres."); return; }
      const credentials = await hashPassword(next);
      account.salt = credentials.salt; account.passwordHash = credentials.hash;
      saveAccounts(accounts);
      window.alert("Senha redefinida neste navegador. Entre com a nova senha.");
    }

    function importWorkspaceBackup(event) {
      const file = event.target.files?.[0]; if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const payload = JSON.parse(reader.result);
          const d = payload?.data;
          const required = ["products", "campaigns", "events", "pieces", "creatives", "audits"];
          if (payload?.app !== "Prumo Mesa da Agência" || !d || !required.every((k) => Array.isArray(d[k]))) throw new Error("Este arquivo não é um backup válido do Prumo.");
          if (!window.confirm("Importar este backup substituirá os dados atuais desta conta neste navegador. Deseja continuar?")) return;
          state.data = d; saveData();
          state.selectedCampaignId = state.data.campaigns[0]?.id || ""; selectCampaign(state.selectedCampaignId); render();
          window.alert("Backup importado com sucesso.");
        } catch (error) { window.alert(error.message || "Não foi possível importar o backup."); }
        finally { event.target.value = ""; }
      };
      reader.readAsText(file);
    }

        const payload=await response.json();if(!response.ok)throw new Error(payload.error?.message||`HTTP ${response.status}`);

        else if(payload.data?.[0]?.url){const imgResponse=await fetch(payload.data[0].url);if(!imgResponse.ok)throw new Error("Não foi possível baixar a imagem retornada.");const blob=await imgResponse.blob();dataUrl=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(blob);});}
        if(!dataUrl)throw new Error("O provedor não retornou imagem em base64 nem URL acessível.");

    // Editor
    function canvasDimensions(format) {
      if (format === "stories" || format === "shorts") return { width: 1080, height: 1920 };
      if (format === "display") return { width: 1920, height: 1080 };
      if (format === "feed45") return { width: 1080, height: 1350 };
      return { width: 1080, height: 1080 };
    }

    function wrapCanvasText(ctx, text, maxWidth) {
      const words = String(text || "").split(/\s+/).filter(Boolean);
      const lines = [];
      let line = "";
      for (const word of words) {
        const test = line ? `${line} ${word}` : word;
        if (ctx.measureText(test).width > maxWidth && line) { lines.push(line); line = word; }
        else line = test;
      }
      if (line) lines.push(line);
      return lines;
    }

    function drawCreativeArtwork(canvas, progress = 1, imageOverride) {
      if (!canvas || !state.editorCurrent) return;
      const cur = state.editorCurrent;
      const camp = state.data.campaigns.find((c) => c.id === cur.campaignId) || state.data.campaigns[0];
      const { width, height } = canvasDimensions(cur.format);
      if (canvas.width !== width || canvas.height !== height) { canvas.width = width; canvas.height = height; }
      const ctx = canvas.getContext("2d");
      if (!ctx) return;
      const paper = cur.treatment !== "ink";
      const bg = paper ? "#e7e0d2" : "#1a1612";
      const ink = paper ? "#1a1612" : "#f3eee4";
      const brass = "#c18a48";
      const pad = Math.round(width * 0.09);
      ctx.clearRect(0, 0, width, height);
      ctx.fillStyle = bg; ctx.fillRect(0, 0, width, height);

      const paint = (image) => {
        if (image) {
          const scale = Math.max(width / image.width, height / image.height);
          const iw = image.width * scale, ih = image.height * scale;
          ctx.save(); ctx.globalAlpha = paper ? 0.26 : 0.42;
          ctx.drawImage(image, (width-iw)/2, (height-ih)/2, iw, ih); ctx.restore();
          ctx.fillStyle = paper ? "rgba(231,224,210,.62)" : "rgba(26,22,18,.60)";
          ctx.fillRect(0, 0, width, height);
        }
        // Decorative framing
        ctx.strokeStyle = paper ? "rgba(26,22,18,.18)" : "rgba(243,238,228,.20)";
        ctx.lineWidth = Math.max(2, width * .002);
        ctx.strokeRect(pad * .55, pad * .55, width - pad * 1.1, height - pad * 1.1);
        ctx.fillStyle = brass; ctx.fillRect(pad, pad, Math.max(5, width * .006), height * .12);
        ctx.textAlign = "left"; ctx.textBaseline = "top";
        ctx.fillStyle = brass; ctx.font = `600 ${Math.round(width*.026)}px Outfit, Arial, sans-serif`;
        ctx.fillText((camp?.client || "PRUMO").toUpperCase().slice(0, 34), pad * 1.35, pad * 1.08);

        const intro = Math.max(0, Math.min(1, progress));
        const shift = (1 - intro) * width * .035;
        const titleSize = Math.round(width * (cur.format === "stories" ? .075 : .068));
        ctx.globalAlpha = .18 + .82 * intro;
        ctx.fillStyle = ink; ctx.font = `600 ${titleSize}px Fraunces, Georgia, serif`;
        const titleLines = wrapCanvasText(ctx, cur.headline || "Título da peça", width - pad*2.7).slice(0, (cur.format === "stories" || cur.format === "shorts") ? 5 : 4);
        let y = height * ((cur.format === "stories" || cur.format === "shorts") ? .30 : cur.format === "feed45" ? .31 : .34) + shift;
        const lineGap = titleSize * 1.12;
        titleLines.forEach(line => { ctx.fillText(line, pad, y); y += lineGap; });
        ctx.globalAlpha = .18 + .82 * intro;
        ctx.fillStyle = paper ? "#51483e" : "#d1c8b9";
        ctx.font = `400 ${Math.round(width*.029)}px Outfit, Arial, sans-serif`;
        const subLines = wrapCanvasText(ctx, cur.sub || "Linha de apoio.", width - pad*2.7).slice(0, 4);
        y += titleSize * .55;
        subLines.forEach(line => { ctx.fillText(line, pad, y); y += width*.042; });

        const bottom = height - pad * 1.2;
        ctx.globalAlpha = .18 + .82 * intro;
        ctx.fillStyle = brass; ctx.font = `600 ${Math.round(width*.033)}px Outfit, Arial, sans-serif`;
        const offerLines = wrapCanvasText(ctx, cur.offer || "", width - pad*2.7).slice(0, 2);
        offerLines.forEach((line, i) => ctx.fillText(line, pad, bottom - width*.17 + i*width*.042));
        const cta = cur.cta || "Saiba mais";
        ctx.font = `600 ${Math.round(width*.027)}px Outfit, Arial, sans-serif`;
        const ctaWidth = Math.min(width-pad*2, ctx.measureText(cta).width + pad*.9);
        const ctaY = bottom - width*.085;
        ctx.fillStyle = paper ? "#1a1612" : "#a56b2a";
        ctx.beginPath(); ctx.roundRect(pad, ctaY, ctaWidth, width*.065, width*.012); ctx.fill();
        ctx.fillStyle = "#f3eee4"; ctx.textBaseline = "middle";
        ctx.fillText(cta, pad + pad*.45, ctaY + width*.0325);
        ctx.globalAlpha = 1;
      };

      if (imageOverride !== undefined) {
        paint(imageOverride);
      } else if (cur.imageDataUrl) {
        const cached = state.editorImageCache;
        if (cached?.src === cur.imageDataUrl && cached.image?.complete && cached.image.naturalWidth) {
          paint(cached.image);
        } else {
          const img = new Image();
          state.editorImageCache = { src: cur.imageDataUrl, image: img };
          img.onload = () => { if (state.editorImageCache?.src === cur.imageDataUrl) drawCreativeArtwork(canvas, progress, img); };
          img.onerror = () => paint(null);
          img.src = cur.imageDataUrl;
        }
      } else paint(null);
    }

    function ensureCreativeImageLoaded() {
      const src = state.editorCurrent?.imageDataUrl;
      if (!src) return Promise.resolve(null);
      const cached = state.editorImageCache;
      if (cached?.src === src && cached.image?.complete && cached.image.naturalWidth) return Promise.resolve(cached.image);
      return new Promise((resolve, reject) => {
        const img = new Image();
        state.editorImageCache = { src, image: img };
        img.onload = () => resolve(img);
        img.onerror = () => reject(new Error("Não foi possível carregar a imagem de fundo."));
        img.src = src;
      });
    }

    function setMediaStatus(message, error = false) {
      const el = document.getElementById("media-export-status");

    function handleCreativeImageUpload(event) {
      const file = event.target.files?.[0];
      if (!file) return;
      if (!file.type.startsWith("image/")) { setMediaStatus("Selecione um arquivo de imagem válido.", true); return; }
      if (file.size > 8 * 1024 * 1024) { setMediaStatus("A imagem deve ter no máximo 8 MB.", true); event.target.value = ""; return; }
      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = () => {
          const max = 1600;
          const scale = Math.min(1, max / Math.max(img.width, img.height));
          const c = document.createElement("canvas"); c.width = Math.round(img.width*scale); c.height = Math.round(img.height*scale);
          c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
          state.editorCurrent.imageDataUrl = c.toDataURL("image/jpeg", .82);
          state.editorImageCache = null;
          state.editorSaved = false; updateLivePreview(); setMediaStatus("Imagem carregada e otimizada. Salve o criativo para mantê-la na biblioteca.");
        };
        img.onerror = () => setMediaStatus("Não foi possível abrir esta imagem.", true);
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    }

    function removeCreativeImage() {
      delete state.editorCurrent.imageDataUrl;
      state.editorImageCache = null;
      state.editorSaved = false; updateLivePreview(); render();
    }

    function downloadBlob(blob, filename) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a"); a.href = url; a.download = filename;

    async function exportCreativeVideo() {
      const canvas = document.getElementById("creative-canvas");
      const duration = Number(state.editorCurrent?.videoDuration || state.editorVideoDuration || 10);
      if (!canvas) return;
      if (!canvas.captureStream || typeof MediaRecorder === "undefined") {
        setMediaStatus("Este navegador não oferece gravação de vídeo. Use Chrome ou Edge atualizado.", true); return;
      }
      const mime = ["video/webm;codecs=vp9", "video/webm;codecs=vp8", "video/webm"].find((m) => MediaRecorder.isTypeSupported(m));
      if (!mime) { setMediaStatus("O navegador não encontrou um codificador WebM compatível.", true); return; }
      try {
        const image = await ensureCreativeImageLoaded();
        const dims = canvasDimensions(state.editorCurrent.format);
        canvas.width = dims.width; canvas.height = dims.height;
        drawCreativeArtwork(canvas, 1, image);
        const stream = canvas.captureStream(30);
        const recorder = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 4500000 });
        const chunks = [];
        recorder.ondataavailable = (e) => { if (e.data?.size) chunks.push(e.data); };
        recorder.onerror = () => { stream.getTracks().forEach(t => t.stop()); setMediaStatus("Falha durante a gravação do vídeo.", true); };
        recorder.onstop = () => {
          stream.getTracks().forEach(t => t.stop());
          const blob = new Blob(chunks, { type: mime });
          if (!blob.size) { setMediaStatus("O vídeo ficou vazio. Tente novamente.", true); return; }
          downloadBlob(blob, `${(state.editorCurrent.name || "prumo-video").replace(/[^a-z0-9-_]+/gi, "-")}.webm`);
          setMediaStatus(`Vídeo WebM de ${duration} segundos exportado. Sem faixa de áudio.`);
        };
        recorder.start(250);
        setMediaStatus("Gravando animação do criativo… não feche esta página.");
        const started = performance.now();
        const frame = (now) => {
          const progress = Math.min(1, (now - started) / (duration * 1000));
          drawCreativeArtwork(canvas, progress < .82 ? Math.min(1, progress / .28) : Math.max(0, (1-progress)/.18), image);
          if (progress < 1 && recorder.state === "recording") requestAnimationFrame(frame);
          else if (recorder.state === "recording") recorder.stop();
        };
        requestAnimationFrame(frame);
      } catch (err) { setMediaStatus(err?.message || "Não foi possível criar o vídeo neste navegador.", true); }
    }

    function parseCsvRow(line, delimiter) {
      const result = []; let value = "", quoted = false;
      for (let i=0; i<line.length; i++) {
        const ch = line[i];
        if (ch === '"' && line[i+1] === '"' && quoted) { value += '"'; i++; }
        else if (ch === '"') quoted = !quoted;
        else if (ch === delimiter && !quoted) { result.push(value); value = ""; }
        else value += ch;
      }
      result.push(value); return result;
    }

    function importEventsCsv(event, campaignId) {
      const file = event.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const raw = String(reader.result || "").replace(/^\uFEFF/, "");
          const first = raw.split(/\r?\n/)[0] || "";
          const delimiter = first.includes(";") ? ";" : ",";
          const lines = raw.split(/\r?\n/).filter(line => line.trim());
          if (lines.length < 2) throw new Error("O CSV precisa conter cabeçalho e pelo menos uma linha.");
          const headers = parseCsvRow(lines[0], delimiter).map(h => h.trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,""));
          const idx = (...keys) => headers.findIndex(h => keys.includes(h));
          const iType=idx("tipo","type"), iVol=idx("volume","quantidade"), iSpend=idx("verba","spend","investimento"), iDate=idx("data","date"), iNote=idx("nota","note");
          if (iType < 0 || iVol < 0 || iDate < 0) throw new Error("Cabeçalhos obrigatórios: tipo, volume e data. Verba e nota são opcionais.");
          const validTypes = Object.keys(EVENT_LABEL);
          const toNumber = (v) => Number(String(v || "0").trim().replace(/\.(?=\d{3}(?:\D|$))/g, "").replace(",", "."));
          const newRows = [];
          for (const line of lines.slice(1)) {
            const cells = parseCsvRow(line, delimiter);
            if (!cells.length) continue;
            const rawType = String(cells[iType] || "").trim().toLowerCase();
            const type = validTypes.includes(rawType) ? rawType : Object.entries(EVENT_LABEL).find(([, label]) => label.toLowerCase() === rawType)?.[0];
            const volume = toNumber(cells[iVol]);
            const spend = iSpend >= 0 ? toNumber(cells[iSpend]) : 0;
            const at = String(cells[iDate] || "").trim();
            if (!type || !Number.isFinite(volume) || volume < 0 || !/^\d{4}-\d{2}-\d{2}$/.test(at)) continue;
            newRows.push({ id: uid("evt"), campaignId, type, volume, spend: Number.isFinite(spend) ? spend : 0, at, note: iNote >= 0 ? String(cells[iNote] || "Importado via CSV").trim() : "Importado via CSV" });
          }
          if (!newRows.length) throw new Error("Nenhuma linha válida encontrada. Confira tipo, volume e data (AAAA-MM-DD).");
          state.data.events = [...newRows, ...state.data.events];
          saveData(); state.gestaoNotice = `${newRows.length} evento(s) importado(s).`; render();
        } catch (err) { state.gestaoNotice = err.message || "Falha ao importar CSV."; render(); }
        event.target.value = "";
      };
      reader.readAsText(file, "utf-8");
    }

    function suggestAudit(campId) {
      const audit = openAudit(campId);
      const blob = [
        ...state.data.pieces.filter((p) => p.campaignId === campId).map((p) => p.text),
        ...state.data.creatives.filter((c) => c.campaignId === campId).flatMap((c) => [c.headline, c.sub, c.offer, c.cta]),
      ].join(" \n ").toLowerCase();
      const hits = [];
      const patch = (refId, status, note) => {
        const chk = audit.checks.find((c) => c.refId === refId);
        if (chk) { chk.status = status; chk.note = note; }
        hits.push(note);
      };
      if (/cura|milagre|garantid|100%|resultado vis[ií]vel|transforma/.test(blob)) {
        patch("saude", "bloqueio", "A peça promete resultado, cura ou garantia.");
        patch("conar", "risco", "A promessa não se demonstra.");
      }
      if (/s[oó] hoje|últimas|ultima hora|corra/.test(blob)) {
        patch("urgencia-datada", "bloqueio", "Urgência sem data verificável no cadastro.");
      }
      if (/de r\$|por r\$/.test(blob)) {
        patch("cdc", "risco", "Preço riscado — confirmar o lastro da oferta.");
      }
      if (/antes e depois/.test(blob)) {
        patch("plataforma", "risco", "Antes e depois esbarra na política do meio.");
      }
      if (/whatsapp|telefone|cpf|email|e-mail|endereco|endereço/.test(blob)) patch("privacidade", "risco", "A peça pode expor dado pessoal ou canal de contato; confirme consentimento e necessidade de exibição.");
      if (/depoimento|cliente disse|avaliação de cliente|foto de cliente/.test(blob)) patch("direitos-imagem", "risco", "Verifique autorização documentada para imagem, depoimento e identificação do cliente.");
      if (/mais vendido|número 1|numero 1|o melhor|líder|lider/.test(blob)) patch("fonte-afirmacao", "risco", "A afirmação comparativa precisa de fonte, período e critério verificáveis.");
      const blocked = hits.some((h) => /promete resultado|Urgência/.test(h));
      audit.verdict = blocked ? "desfavoravel" : hits.length ? "pendente" : "favoravel";
      audit.alert = hits.length ? hits.join(" ") : "";
      audit.accepted = false;
      audit.acceptor = "";
      audit.acceptedAt = "";
      audit.history = audit.history || [];
      audit.history.unshift({ at: new Date().toLocaleString("pt-BR"), action: "Análise local", actor: state.user?.name || "Usuário", verdict: audit.verdict, alert: audit.alert || "" });
      state.auditorHint = hits.length ? "A leitura achou pontos. O parecer não sobe sozinho — você confirma." : "Nada gritante nas peças. Confira mesmo assim.";
      saveData();
      render();
    }
    function updateAuditCheck(auditId, checkId, status) {
      const a = state.data.audits.find((x) => x.id === auditId);
      if (a) {
        const c = a.checks.find((x) => x.id === checkId);
        if (c) c.status = status;
        saveData();
        render();
      }
    }
    function setAuditVerdict(auditId, verdict) {
      const a = state.data.audits.find((x) => x.id === auditId);
      if (a) { a.verdict = verdict; saveData(); render(); }
    }
    function setAuditAlert(auditId, alert) {
      const a = state.data.audits.find((x) => x.id === auditId);
      if (a) { a.alert = alert; saveData(); }
    }
    function acceptAudit(auditId) {
      const a = state.data.audits.find((x) => x.id === auditId);
      if (!a) return;
      if (!state.auditorName.trim()) { state.auditorHint = "O aceite pede o nome de quem assume."; render(); return; }
      a.accepted = true;
      a.acceptor = state.auditorName.trim();
      a.acceptedAt = new Date().toISOString().slice(0, 10);
      a.history = a.history || [];
      a.history.unshift({ at: new Date().toLocaleString("pt-BR"), action: "Aceite manual", actor: a.acceptor, verdict: a.verdict, alert: a.alert || "" });
      state.auditorHint = a.verdict === "desfavoravel" ? "Aceite registrado com ressalva." : "Aceite registrado.";
      saveData();
      render();
    }

    // =========================================================================
    // PRUMO ASSISTENTE — painel lateral independente e genérico
    // =========================================================================
    async function prumoApiRequest(path, options = {}) {
      const base = prumoApiBase();
      if (!base) throw new Error("A URL da API do Prumo ainda não foi configurada.");
      const headers = { "Content-Type": "application/json", ...(options.token ? { Authorization: `Bearer ${options.token}` } : {}) };
      const response = await fetch(`${base}${path}`, { method: options.method || "GET", headers, ...(options.body ? { body: JSON.stringify(options.body) } : {}) });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.error || data.message || `A API respondeu com erro ${response.status}.`);
      return data;
    }

    let prumoAssistantHistory = [];
    let prumoAssistantBusy = false;
    let prumoAssistantQuota = null;
    function prumoHistoryKey() { return `prumo_chat_v1:${String(state.user?.email || "guest").toLowerCase()}`; }
    function loadPrumoHistory() {
      try { prumoAssistantHistory = JSON.parse(sessionStorage.getItem(prumoHistoryKey()) || "[]"); }
      catch { prumoAssistantHistory = []; }
      if (!Array.isArray(prumoAssistantHistory)) prumoAssistantHistory = [];
      if (!prumoAssistantHistory.length) prumoAssistantHistory.push({ role: "assistant", content: "Olá! No que posso ajudar?" });
    }
    function savePrumoHistory() {
      try { sessionStorage.setItem(prumoHistoryKey(), JSON.stringify(prumoAssistantHistory.slice(-20))); } catch {}
    }
    function appendPrumoChatMessage(role, content) {
      const log = document.getElementById("prumo-ai-log");
      if (!log) return;
      const bubble = document.createElement("div");
      bubble.className = `prumo-ai-message ${role}`;
      bubble.textContent = content;
      log.appendChild(bubble);
      log.scrollTop = log.scrollHeight;
    }
    function drawPrumoHistory() {
      const log = document.getElementById("prumo-ai-log");
      if (!log) return;
      log.innerHTML = "";
      if (!prumoAssistantHistory.length) prumoAssistantHistory = [{ role: "assistant", content: "Olá! No que posso ajudar?" }];
      prumoAssistantHistory.forEach((item) => appendPrumoChatMessage(item.role === "user" ? "user" : "assistant", item.content));
    }
    function setPrumoQuota(used, limit) {
      prumoAssistantQuota = { used: Number(used || 0), limit: Number(limit || 2), remaining: Math.max(0, Number(limit || 2) - Number(used || 0)) };
      const badge = document.getElementById("prumo-ai-quota");
      if (badge) badge.textContent = `${prumoAssistantQuota.remaining}/${prumoAssistantQuota.limit} créditos hoje`;
    }
    async function refreshPrumoQuota() {
      const badge = document.getElementById("prumo-ai-quota");
      if (!state.user?.apiToken || !prumoApiBase()) { if (badge) badge.textContent = "API não conectada"; return; }
      try {
        const info = await prumoApiRequest("/api/me", { token: state.user.apiToken });
        setPrumoQuota(info.quota.used, info.quota.limit);
      } catch (err) {
        if (badge) badge.textContent = err.message.includes("401") ? "Sessão expirada" : "Não foi possível consultar";
      }
    }
    function openPrumoAssistant() {
      const panel = document.getElementById("prumo-ai-panel");
      if (!panel) return;
      panel.classList.add("is-open");
      panel.setAttribute("aria-hidden", "false");
      document.body.classList.add("prumo-chat-open");
      document.getElementById("prumo-ai-toggle")?.setAttribute("aria-expanded", "true");
      drawPrumoHistory();
      refreshPrumoQuota();
      setTimeout(() => document.getElementById("prumo-ai-input")?.focus(), 160);
    }
    function closePrumoAssistant() {
      const panel = document.getElementById("prumo-ai-panel");
      panel?.classList.remove("is-open");
      panel?.setAttribute("aria-hidden", "true");
      document.body.classList.remove("prumo-chat-open");
      document.getElementById("prumo-ai-toggle")?.setAttribute("aria-expanded", "false");
    }
    function ensurePrumoAssistant() {
      const existing = document.getElementById("prumo-ai-widget");
      if (!state.user) {
        existing?.remove();
        document.getElementById("prumo-pet")?.hide?.();
        return;
      }
      if (!existing) {
        const wrapper = document.createElement("div");
        wrapper.id = "prumo-ai-widget";
        wrapper.innerHTML = `
          <button type="button" class="prumo-ai-toggle" id="prumo-ai-toggle" aria-controls="prumo-ai-panel" aria-expanded="false" onclick="openPrumoAssistant()"><span class="prumo-ai-dot"></span> Assistente IA</button>
          <aside class="prumo-ai-panel" id="prumo-ai-panel" aria-label="Assistente de IA do Prumo" aria-hidden="true">
            <header class="prumo-ai-head"><div><div class="prumo-ai-kicker">Prumo · Assistente</div><h2 class="prumo-ai-title">Vamos pensar juntos.</h2><p class="prumo-ai-subtitle">Um espaço para perguntar, organizar e criar.</p></div><button class="prumo-ai-close" type="button" aria-label="Fechar assistente" onclick="closePrumoAssistant()">×</button></header>
            <div class="prumo-ai-status"><span>Conversa geral · Agência Prumo</span><span class="prumo-ai-quota" id="prumo-ai-quota">2/2 créditos hoje</span></div>
            <div class="prumo-ai-log" id="prumo-ai-log" aria-live="polite"></div>
            <div class="prumo-ai-suggestions" id="prumo-ai-suggestions"><button type="button" onclick="usePrumoSuggestion('Ajude-me a estruturar uma campanha de marketing.')">Estruturar campanha</button><button type="button" onclick="usePrumoSuggestion('Revise este texto e sugira melhorias.')">Revisar texto</button><button type="button" onclick="usePrumoSuggestion('Ajude-me a organizar uma ideia em etapas.')">Organizar ideia</button></div>
            <footer class="prumo-ai-composer"><form class="prumo-ai-form" onsubmit="sendPrumoChat(event)"><textarea class="prumo-ai-input" id="prumo-ai-input" rows="1" maxlength="4000" placeholder="Escreva sua mensagem…" aria-label="Mensagem para o assistente"></textarea><button class="prumo-ai-send" id="prumo-ai-send" type="submit" aria-label="Enviar mensagem">↑</button></form><p class="prumo-ai-footnote">Cada mensagem enviada ao chatbot consome 1 crédito. O assistente usa Cloudflare Workers AI; não precisa de chave OpenAI. Abrir o chat não consome créditos. Digite <strong>/pet</strong> para trazer o mascote de volta (comando local e gratuito).</p></footer>
          </aside>`;
        document.body.appendChild(wrapper);
        loadPrumoHistory();
        drawPrumoHistory();
        const input = document.getElementById("prumo-ai-input");
        input?.addEventListener("keydown", (event) => { if (event.key === "Enter" && !event.shiftKey) { event.preventDefault(); document.querySelector(".prumo-ai-form")?.requestSubmit(); } });
        document.addEventListener("prumo:open-chat", openPrumoAssistant);
        document.addEventListener("keydown", (event) => { if (event.key === "Escape") closePrumoAssistant(); });
      }
      document.getElementById("prumo-pet")?.show?.();
      if (!prumoApiBase()) {
        const badge = document.getElementById("prumo-ai-quota");
        if (badge) badge.textContent = "Configure a API";
      }
    }
    function usePrumoSuggestion(text) {
      const input = document.getElementById("prumo-ai-input");
      if (input) { input.value = text; input.focus(); }
    }
    async function sendPrumoChat(event) {
      event.preventDefault();
      if (prumoAssistantBusy) return;
      const input = document.getElementById("prumo-ai-input");
      const send = document.getElementById("prumo-ai-send");
      const message = String(input?.value || "").trim();
      if (!message) return;
      // /pet é um comando local: chama o mascote sem consultar a IA e sem consumir crédito.
      if (message.toLowerCase() === "/pet") {
        if (input) { input.value = ""; input.focus(); }
        document.getElementById("prumo-pet")?.summon?.();
        appendPrumoChatMessage("system", "Pru voltou! 🐾 Este comando é local e não consome créditos.");
        return;
      }
      if (!prumoApiBase()) { appendPrumoChatMessage("system", "A API ainda não foi configurada. Siga o guia do pacote para publicar o Worker e informar sua URL em PRUMO_CONFIG.apiUrl."); return; }
      if (!state.user?.apiToken) { appendPrumoChatMessage("system", "Entre novamente pela conta online para autenticar o assistente."); return; }
      prumoAssistantBusy = true;
      if (send) send.disabled = true;
      if (input) { input.value = ""; input.disabled = true; }
      prumoAssistantHistory.push({ role: "user", content: message });
      appendPrumoChatMessage("user", message);
      const log = document.getElementById("prumo-ai-log");
      const typing = document.createElement("div");
      typing.className = "prumo-ai-typing";
      typing.id = "prumo-ai-typing";
      typing.innerHTML = '<span class="prumo-ai-bean"></span><span class="prumo-ai-bean"></span><span class="prumo-ai-bean"></span>';
      log?.appendChild(typing);
      if (log) log.scrollTop = log.scrollHeight;
      try {
        const messages = prumoAssistantHistory.slice(-12).map(item => ({ role: item.role, content: item.content }));
        const result = await prumoApiRequest("/api/chat", { method: "POST", token: state.user.apiToken, body: { messages } });
        document.getElementById("prumo-ai-typing")?.remove();
        const answer = String(result.answer || "Não recebi uma resposta. Tente novamente.");
        prumoAssistantHistory.push({ role: "assistant", content: answer });
        appendPrumoChatMessage("assistant", answer);
        if (result.quota) setPrumoQuota(result.quota.used, result.quota.limit);
        savePrumoHistory();
      } catch (err) {
        document.getElementById("prumo-ai-typing")?.remove();
        appendPrumoChatMessage("system", err.message || "Não foi possível conectar ao assistente.");
        if (err.message.toLowerCase().includes("crédito") || err.message.toLowerCase().includes("limite")) refreshPrumoQuota();
        // Remove a mensagem não respondida do histórico que será enviado como contexto.
        prumoAssistantHistory.pop();
      } finally {
        prumoAssistantBusy = false;
        if (send) send.disabled = false;
        if (input) { input.disabled = false; input.focus(); }
      }
    }

    // =========================================================================
    // RENDER PRINCIPAL
    // =========================================================================
    function render() {
      const root = document.getElementById("app");
      if (!state.user) {
        root.innerHTML = renderAuth();
        ensurePrumoAssistant();
        return;
      }
      const pages = {
        mesa: pageMesa,
        catalogo: pageCatalogo,
        crm: pageCrm,
        copy: pageCopy,
        editor: pageEditor,
        campanhas: pageCampanhas,
        gestao: pageGestao,
        auditoria: pageAuditoria,
      };
      const fn = pages[state.route] || pageMesa;
      root.innerHTML = renderShell(fn());
      ensurePrumoAssistant();
      if (state.route === "editor") requestAnimationFrame(() => updateLivePreview());
    }

    render();
  </script>
</body>
</html>
