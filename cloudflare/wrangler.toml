name = "prumo-api"
main = "worker.js"
compatibility_date = "2026-11-26"

[vars]
WORKERS_AI_MODEL = "@cf/google/gemma-4-26b-a4b-it"
DAILY_CREDITS = "2"
APP_TIME_ZONE = "America/Fortaleza"
# Depois de publicar o site, informe o domínio pages.dev ou domínio próprio:
# ALLOWED_ORIGINS = "https://SEU-SITE.pages.dev"

[[d1_databases]]
binding = "DB"
database_name = "prumo-db"
database_id = "PREENCHER_COM_O_ID_REAL_DO_D1"

[ai]
binding = "AI"
